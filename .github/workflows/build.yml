name: Build and test macOS
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (live API test skipped without explicit credentials)
        run: swift test
      - name: Build application
        run: ./scripts/build-app.sh
      - name: Archive application
        run: ditto -c -k --sequesterRsrc --keepParent .build/Violet.app .build/Violet-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Violet-macOS-development
          path: .build/Violet-macOS.zip
